on:
  workflow_call:
    inputs:
      python-version:
        type: string
        description: The version of python to install, default is from .python-version file
        default: ""
      runs-on:
        type: string
        description: The runner to run this job on
        required: true

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"
  DOCKER_PROVIDER: "docker"
  KODMAN_SYSTEM_TESTING: "true"
  UV_PYTHON: ${{ inputs.python-version }}

jobs:
  run:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: start minikube
        id: minikube
        uses: medyagh/setup-minikube@master
      - run: docker version
      - run: docker pull ubuntu
      - run: kubectl version
      - run: kubectl apply -f .github/manifests
      - run: kubectl auth can-i --as=system:serviceaccount:default:default create pods -n default

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: uv run --locked tox -e tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          name: ${{ inputs.python-version }}/${{ inputs.runs-on }}
          files: cov.xml
